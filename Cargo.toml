[workspace]
members = [
  "crates/kuzushi-cli",
  "crates/kuzushi-core",
  "crates/kuzushi-eval",
  "crates/kuzushi-openai",
  "crates/kuzushi-tui",
]
resolver = "2"

[workspace.package]
version = "0.24.0-alpha.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Shayaun Nejad"]
repository = "https://github.com/allsmog/Kuzushi.git"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
libc = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "0.8"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
uuid = { version = "1.11", features = ["v4"] }
