# Fetch git dependencies through the system git binary so its credential helper
# is used (e.g. the gh CLI locally, or GITHUB_TOKEN/PAT-backed HTTPS auth in
# CI). Required for the private oxidized-joern (cpg-*) dependency pinned in the
# workspace Cargo.toml. Without this, cargo's built-in libgit2 fetch does not
# consult the git credential helper and the private clone fails.
[net]
git-fetch-with-cli = true

# Kuzushi is a large Rust workspace, and Cargo's default dev/test profile emits
# full debugger metadata for every crate. Keep line-numbered panic backtraces
# for workspace code while omitting dependency debug data; this substantially
# reduces target/ growth and link work during normal builds and tests.
#
# Incremental compilation is off by default: rustc mints one multi-GiB
# incremental session tree per crate compile-unit/flag variant and never
# garbage-collects stale variants, which is the measured driver of runaway
# target/ growth (see docs/build-disk.md). Re-enable it per invocation with
# CARGO_INCREMENTAL=1 (the env var overrides this profile setting) or use the
# debugging profile below.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Shipped binaries do not need symbol tables. Removing them keeps platform
# package downloads within the published size budget.
[profile.release]
strip = "symbols"

# Full debugger metadata and incremental rebuilds remain an explicit opt-in:
#   cargo build --profile debugging
#   cargo test --profile debugging
[profile.debugging]
inherits = "dev"
debug = true
incremental = true
