# Keep dependency advisories actionable: one monthly batched update PR per
# ecosystem for the Rust workspace, the npm package, and the pinned GitHub
# Actions. Weekly checks opened up to fifteen concurrent pull requests, each
# of which charged a full CI run; monthly grouped batches keep the same
# advisory coverage for a fraction of the runner minutes.
#
# Grouping covers minor and patch only. Majors stay ungrouped so a breaking
# upgrade arrives as its own reviewable pull request instead of hiding inside
# a batch. Security advisories are exempt from `open-pull-requests-limit` and
# are still raised as soon as Dependabot sees them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
