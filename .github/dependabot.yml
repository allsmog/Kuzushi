# Keep dependency advisories actionable: one monthly batched update PR per
# ecosystem for the Rust workspace, the npm package, and the pinned GitHub
# Actions. Weekly checks opened up to fifteen concurrent pull requests, each
# of which charged a full CI run; monthly grouped batches keep the same
# advisory coverage for a fraction of the runner minutes.
#
# Grouping covers minor and patch only. Majors stay ungrouped so a breaking
# upgrade arrives as its own reviewable pull request instead of hiding inside
# a batch.
#
# Dependabot's security updates are exempt from `open-pull-requests-limit`,
# but only when they are enabled for the repository and the advisory names an
# affected range Dependabot can resolve. Do not read that exemption as
# coverage: no pull request was ever opened for the wasmtime 49.0.5 and 49.0.6
# security releases, so #379 had to take thirteen advisories by hand. The gate
# that is guaranteed to look is the daily `cargo deny check advisories` run in
# .github/workflows/supply-chain.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
