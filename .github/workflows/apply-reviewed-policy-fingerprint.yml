name: Apply reviewed policy fingerprint

on:
  push:
    branches:
      - ci/2026-08-04-full-private-product
    paths:
      - '.github/workflows/apply-reviewed-policy-fingerprint.yml'

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/ci/2026-08-04-full-private-product'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/2026-08-04-full-private-product
          fetch-depth: 1
      - name: Replace only the reviewed fingerprint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/kuzushi-core/src/modules/registry/tests.rs')
          old = 'a29eb2520ee5984cd40fa5b9c75dabe070370e33d44d51f09e086fb396bf55d1'
          new = '5b026b99fbe9f5caa4c630dd635c100e841f5f9c4ccfbd1819689f418b18ff36'
          text = path.read_text()
          if text.count(old) != 1 or new in text:
              raise SystemExit('registry policy fingerprint was not in the exact reviewed state')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- crates/kuzushi-core/src/modules/registry/tests.rs
      - name: Commit the reviewed inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/kuzushi-core/src/modules/registry/tests.rs
          git commit -m 'test(registry): accept reviewed built-in policy inventory'
          git push origin HEAD:ci/2026-08-04-full-private-product
