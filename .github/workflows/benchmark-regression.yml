name: Benchmark Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  # The benchmark is deterministic (mock Anthropic server + vendored
  # fixtures), so it can gate merges that touch detection quality.
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "crates/kuzushi-core/**"
      - "src/**"
      - ".github/workflows/benchmark-regression.yml"

# Scheduled + manual overlap: let both finish instead of cancelling a live
# run; PR runs cancel superseded pushes on the same ref.
concurrency:
  group: benchmark-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - run: bash benchmarks/govwa/setup.sh

      - name: Start mock Anthropic API server
        run: |
          set -euo pipefail
          echo "Benchmark regression uses a deterministic mock Anthropic server; not a real LLM integration test."
          MOCK_URL_FILE="${RUNNER_TEMP}/mock-url.txt"
          : > "${MOCK_URL_FILE}"
          node tests/fixtures/mock-anthropic-server.mjs > "${MOCK_URL_FILE}" &
          MOCK_PID=$!
          echo "MOCK_PID=${MOCK_PID}" >> "${GITHUB_ENV}"

          # Poll up to 15s for the URL file to populate and the server to respond.
          deadline=$(( $(date +%s) + 15 ))
          MOCK_BASE_URL=""
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            if [ -s "${MOCK_URL_FILE}" ]; then
              MOCK_BASE_URL="$(head -n 1 "${MOCK_URL_FILE}")"
              if [ -n "${MOCK_BASE_URL}" ] \
                && curl -sSf -o /dev/null --max-time 2 -X POST \
                     -H 'content-type: application/json' -d '{}' \
                     "${MOCK_BASE_URL}/v1/messages"; then
                break
              fi
            fi
            # Bail early if the mock crashed before becoming ready.
            if ! kill -0 "${MOCK_PID}" 2>/dev/null; then
              echo "mock server exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.25
          done

          if [ -z "${MOCK_BASE_URL}" ]; then
            echo "mock server did not become ready within 15s" >&2
            exit 1
          fi
          echo "MOCK_BASE_URL=${MOCK_BASE_URL}" >> "${GITHUB_ENV}"
          echo "mock server ready at ${MOCK_BASE_URL}"

      - name: Write benchmark scan config
        run: |
          set -euo pipefail
          mkdir -p benchmarks/govwa/repo/.kuzushi
          # jq builds valid JSON without quote-fragile heredoc expansion.
          jq -n --arg baseUrl "${MOCK_BASE_URL}" '{
            model: "anthropic:claude-sonnet-4-6",
            agentRuntimeConfig: { baseUrl: $baseUrl, apiKey: "fake-key" },
            scanners: ["semgrep"],
            enabledTasks: ["context-gatherer"],
            verify: false,
            triageConcurrency: 1,
            triageBatchSize: 1,
            scanMode: "sequential",
            auditLog: false,
            enableContextGathering: false,
            enableContextEnrichment: false,
            llmRescoreEnabled: false,
            fpFilterEnabled: false
          }' > benchmarks/govwa/repo/.kuzushi/config.json

      - run: pnpm benchmark --run --dataset benchmarks/govwa --output benchmarks/govwa/results/metrics-ci.json

      - name: Write benchmark mock-mode note
        run: |
          mkdir -p benchmarks/govwa/results
          cat > benchmarks/govwa/results/mock-mode.txt <<'EOF'
          Deterministic benchmark run using tests/fixtures/mock-anthropic-server.mjs.
          Metrics reflect mock-backed fixture coverage, not a real LLM integration test.
          EOF

      - run: pnpm benchmark:regression --results benchmarks/govwa/results/metrics-ci.json

      - name: Render detection scoreboard
        run: pnpm benchmark:scoreboard --results benchmarks/govwa/results/metrics-ci.json --output benchmarks/govwa/results/SCOREBOARD.md --mock

      - name: Stop mock Anthropic server
        if: always()
        run: |
          if [ -n "${MOCK_PID:-}" ]; then
            kill "${MOCK_PID}" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-regression-artifacts
          path: |
            benchmarks/govwa/results
            benchmarks/baseline.json
