name: Benchmark Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  # The committed fixture is the deterministic regression gate. The live
  # Semgrep run below is a smoke check because registry rule content can move
  # independently of this repository.
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "crates/kuzushi-core/**"
      - "crates/kuzushi-cli/**"
      - "crates/kuzushi-codeindex/**"
      - "crates/kuzushi-eval/**"
      - "crates/kuzushi-mcp-*/**"
      - "crates/kuzushi-openai/**"
      - "crates/kuzushi-sandbox/**"
      - "src/**"
      - "evals/**"
      - "assets/pashov-xray/**"
      - "scripts/langgraph-bridge.mjs"
      - "scripts/langgraph-bridge/**"
      - "scripts/kuzushi-dynamic-module-host.mjs"
      - "scripts/taint_iris_next_flows.sc"
      - ".github/workflows/benchmark-regression.yml"

# Scheduled + manual overlap: let both finish instead of cancelling a live
# run; PR runs cancel superseded pushes on the same ref.
concurrency:
  group: benchmark-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify benchmark gate contracts
        run: node --test benchmarks/regression-check.test.mjs scripts/typecheck-all.test.mjs
      - name: Compare the committed deterministic fixture
        run: pnpm benchmark:regression -- --results benchmarks/fixtures/mock-govwa-metrics.json
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - run: cargo build -p kuzushi-cli
      - run: bash benchmarks/govwa/setup.sh

      - name: Run the live Semgrep benchmark smoke check
        run: >-
          pnpm benchmark --run
          --dataset benchmarks/govwa
          --config '{"tasks":"semgrep"}'
          --provenance benchmarks/baseline-provenance.json
          --output benchmarks/govwa/results/metrics-ci.json

      - name: Write benchmark execution note
        run: |
          mkdir -p benchmarks/govwa/results
          cat > benchmarks/govwa/results/execution-mode.txt <<'EOF'
          Live semgrep-only smoke check over the pinned GoVWA corpus.
          It makes no model-provider request. Results are diagnostic and are
          not compared with the committed deterministic-fixture baseline
          because Semgrep registry rule content is not repository-pinned.
          EOF

      - name: Require a non-empty live detector result
        run: jq -e '(.tp + .fp) > 0' benchmarks/govwa/results/metrics-ci.json

      - name: Render detection scoreboard
        run: pnpm benchmark:scoreboard --results benchmarks/govwa/results/metrics-ci.json --output benchmarks/govwa/results/SCOREBOARD.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-regression-artifacts
          path: |
            benchmarks/govwa/results
            benchmarks/baseline.json
            benchmarks/baseline-provenance.json
