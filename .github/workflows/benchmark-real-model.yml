name: Real-model Benchmark (Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_REAL_MODEL_BENCHMARK to authorize provider spend"
        required: true
        type: string
      model:
        description: "Explicit Anthropic model (provider:model)"
        required: true
        default: "anthropic:claude-sonnet-4-6"
        type: string
      tasks:
        description: "Comma-separated scan tasks that exercise the model"
        required: true
        default: "agentic-sast"
        type: string
      budget:
        description: "Prevalidated per-operation USD caps (maximum aggregate is the sum)"
        required: true
        default: "triage=2,classifier-gate=2,deep-audit=5,full-mode-multi=5,patch=0"
        type: choice
        options:
          - "triage=2,classifier-gate=2,deep-audit=5,full-mode-multi=5,patch=0"
          - "triage=5,classifier-gate=5,deep-audit=10,full-mode-multi=10,patch=0"

permissions:
  contents: read

concurrency:
  group: real-model-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-model-benchmark:
    # Configure required reviewers on this GitHub environment. The typed
    # confirmation below is a second, explicit spend boundary.
    environment: real-model-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BENCHMARK_BUDGET: ${{ inputs.budget }}
      BENCHMARK_CONFIRMATION: ${{ inputs.confirmation }}
      BENCHMARK_TASKS: ${{ inputs.tasks }}
      KUZUSHI_MODEL: ${{ inputs.model }}
      KUZUSHI_SKIP_ONBOARDING: "1"
    steps:
      - name: Require explicit approval, credentials, and provider
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BENCHMARK_CONFIRMATION}" != "RUN_REAL_MODEL_BENCHMARK" ]; then
            echo "Refusing provider spend: confirmation text did not match." >&2
            exit 1
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Refusing provider run: ANTHROPIC_API_KEY is not configured." >&2
            exit 1
          fi
          case "${KUZUSHI_MODEL}" in
            anthropic:*) ;;
            *) echo "This workflow accepts only an explicit anthropic:* model." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify benchmark gate contracts before spending
        run: node --test benchmarks/regression-check.test.mjs scripts/typecheck-all.test.mjs
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - run: cargo build -p kuzushi-cli
      - run: bash benchmarks/govwa/setup.sh

      - name: Run explicitly approved real-model benchmark
        shell: bash
        run: |
          set -euo pipefail
          config="$(jq -cn \
            --arg tasks "${BENCHMARK_TASKS}" \
            --arg budget "${BENCHMARK_BUDGET}" \
            '{mode:"standard", tasks:$tasks, budget:$budget}')"
          mkdir -p benchmarks/govwa/results
          jq -n \
            --argjson scanConfig "${config}" \
            --arg modelIdentity "${KUZUSHI_MODEL}" \
            --arg kuzushiRevision "${GITHUB_SHA}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              schemaVersion: 1,
              executionMode: "real-model",
              harnessContractVersion: "kuzushi-benchmark-v2",
              scanConfig: $scanConfig,
              modelIdentity: $modelIdentity,
              kuzushiRevision: $kuzushiRevision,
              generatedAt: $generatedAt
            }' > benchmarks/govwa/results/provenance-real.json
          pnpm benchmark --run \
            --dataset benchmarks/govwa \
            --config "${config}" \
            --provenance benchmarks/govwa/results/provenance-real.json \
            --output benchmarks/govwa/results/metrics-real.json

      - name: Create provenance-bound real-model candidate baseline
        shell: bash
        run: |
          set -euo pipefail
          pnpm benchmark:regression -- \
            --results benchmarks/govwa/results/metrics-real.json \
            --baseline benchmarks/govwa/results/baseline-real-candidate.json \
            --bootstrap-baseline
          pnpm benchmark:scoreboard \
            --results benchmarks/govwa/results/metrics-real.json \
            --output benchmarks/govwa/results/SCOREBOARD-real.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-model-benchmark-${{ github.run_id }}
          path: benchmarks/govwa/results
