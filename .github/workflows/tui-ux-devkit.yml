name: TUI UX isolated verification kit
on:
  push:
    branches: [daily/2026-09-06-tui-ux-contracts]
    paths: [.github/workflows/tui-ux-devkit.yml]
permissions:
  contents: read
jobs:
  kit:
    if: github.repository == 'allsmog/Kuzushi' && github.ref == 'refs/heads/daily/2026-09-06-tui-ux-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.3.1'
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Prepare only public tooling and lockfile-bound dependency sources
        run: |
          mkdir -p /tmp/ux-kit/tooling /tmp/ux-kit/source
          pnpm install --frozen-lockfile
          cargo vendor --locked /tmp/ux-kit/tooling/vendor > /tmp/ux-kit/tooling/vendor-config.toml
          cp -a "$(rustc --print sysroot)" /tmp/ux-kit/tooling/rust
          cp "$(command -v node)" /tmp/ux-kit/tooling/node
          cp -a "$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")" /tmp/ux-kit/tooling/pnpm
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          cp /usr/bin/tmux /tmp/ux-kit/tooling/tmux
          git rev-parse HEAD > /tmp/ux-kit/source/source-sha.txt
          git archive HEAD | tar -x -C /tmp/ux-kit/source
          cp -a node_modules /tmp/ux-kit/source/
          tar -czf /tmp/ux-kit-source.tar.gz -C /tmp/ux-kit/source .
          tar -czf /tmp/ux-kit-tooling.tar.gz -C /tmp/ux-kit/tooling .
      - uses: actions/upload-artifact@v7
        with:
          name: kuzushi-ux-isolated-source
          path: /tmp/ux-kit-source.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: kuzushi-ux-isolated-tooling
          path: /tmp/ux-kit-tooling.tar.gz
          retention-days: 1
          compression-level: 0
