name: Apply quality base hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-quality-base-hardening.yml'
  push:
    branches:
      - ci/2026-08-04-full-private-product
    paths:
      - '.github/workflows/apply-quality-base-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/2026-08-04-full-private-product
          fetch-depth: 1
      - name: Wire one explicit base through reusable and release CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          dispatch_anchor = "        default: true\n  workflow_call:"
          dispatch_replacement = (
              "        default: true\n"
              "      quality_base_ref:\n"
              "        description: Explicit Git base for changed-code quality gates\n"
              "        required: false\n"
              "        type: string\n"
              "        default: ''\n"
              "  workflow_call:"
          )
          call_anchor = "        default: true\n    secrets:"
          call_replacement = (
              "        default: true\n"
              "      quality_base_ref:\n"
              "        description: Explicit Git base for changed-code quality gates\n"
              "        required: false\n"
              "        type: string\n"
              "        default: ''\n"
              "    secrets:"
          )
          for old, new, label in (
              (dispatch_anchor, dispatch_replacement, 'workflow_dispatch input'),
              (call_anchor, call_replacement, 'workflow_call input'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'expected one {label} anchor, found {text.count(old)}')
              text = text.replace(old, new)
          expression = '$' + '{{'
          old_base = expression + " github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          new_base = expression + " inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          if text.count(old_base) != 3:
              raise SystemExit(f'expected three changed-code base expressions, found {text.count(old_base)}')
          ci.write_text(text.replace(old_base, new_base))

          release = Path('.github/workflows/release.yml')
          text = release.read_text()
          old = "    uses: ./.github/workflows/full-product-ci.yml\n    secrets:"
          new = "    uses: ./.github/workflows/full-product-ci.yml\n    with:\n      quality_base_ref: HEAD^\n    secrets:"
          if text.count(old) != 1:
              raise SystemExit(f'expected one release caller anchor, found {text.count(old)}')
          release.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/ci.yml .github/workflows/release.yml
      - name: Commit explicit quality-base wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/release.yml
          git commit -m 'ci: pass an explicit changed-code base through release validation'
          git push origin HEAD:ci/2026-08-04-full-private-product
