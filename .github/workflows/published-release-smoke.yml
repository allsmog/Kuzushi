name: Published Release Smoke

on:
  workflow_call:
    inputs:
      version:
        description: Published npm version or matching v-prefixed release tag
        required: true
        type: string
      hosted:
        description: Smoke the darwin legs on GitHub-hosted macOS runners (false uses the self-hosted Mac)
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version; blank uses the npm latest tag
        required: false
        type: string
      hosted:
        description: Smoke the darwin legs on GitHub-hosted macOS runners (false uses the self-hosted Mac)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  published-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x64
          - os: ubuntu-24.04-arm
            slug: linux-arm64
          - os: macos-15-intel
            slug: darwin-x64
            self_hosted: true
            rosetta: "1"
          - os: macos-14
            slug: darwin-arm64
            self_hosted: true
          - os: windows-2025
            slug: win32-x64
    name: published-${{ matrix.slug }}
    # Both darwin legs default to the GitHub-hosted `macos-15-intel` and
    # `macos-14` images. `hosted: false` moves them onto the owner's
    # self-hosted Apple silicon runner, where darwin-x64 is smoked under Rosetta.
    runs-on: ${{ fromJSON(matrix.self_hosted && !inputs.hosted && '["self-hosted","macOS","ARM64","kuzushi-mac"]' || format('["{0}"]', matrix.os)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm gates `@kuzushi/darwin-x64` on `process.arch === "x64"`, so the
      # translated leg needs an x64 Node ahead of the host's arm64 one. Putting
      # its prefix first on PATH is enough: macOS runs the x64 binaries under
      # Rosetta, and npm's `#!/usr/bin/env node` shebang then resolves to it.
      - name: Lead with the x64 Node toolchain for the translated darwin-x64 leg
        if: ${{ matrix.rosetta && !inputs.hosted }}
        shell: bash
        env:
          X64_NODE_PREFIX: ${{ vars.KUZUSHI_X64_NODE_PREFIX || '/usr/local' }}
        run: |
          set -euo pipefail
          node_path="${X64_NODE_PREFIX}/bin/node"
          if [[ ! -x "${node_path}" ]]; then
            echo "no x64 Node at ${node_path}; see docs/quality/release-legs-self-hosted.md" >&2
            exit 1
          fi
          reported="$("${node_path}" -p 'process.arch')"
          if [[ "${reported}" != "x64" ]]; then
            echo "${node_path} reports ${reported}, but the darwin-x64 leg needs x64" >&2
            exit 1
          fi
          echo "${X64_NODE_PREFIX}/bin" >> "${GITHUB_PATH}"
      - name: Install and exercise the published release
        env:
          KUZUSHI_SMOKE_VERSION: ${{ inputs.version }}
          KUZUSHI_SMOKE_RECEIPT: published-release-smoke.json
          KUZUSHI_SMOKE_SLUG: ${{ matrix.slug }}
          KUZUSHI_SMOKE_ALLOW_ROSETTA: ${{ matrix.rosetta }}
        run: node scripts/smoke-published-release.mjs
      - name: Upload consumer receipt
        if: always() && hashFiles('published-release-smoke.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-release-smoke-${{ matrix.slug }}
          path: published-release-smoke.json
          if-no-files-found: error
          retention-days: 30
