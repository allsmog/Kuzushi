# Reference GitHub Actions workflow for running Kuzushi in CI.
#
# Copy this file to your own repository under .github/workflows/kuzushi.yml
# and tune it for your project. This template demonstrates the current Rust
# CLI workflow:
#
#   1. Run `doctor` and keep its JSON preflight output.
#   2. Run `scan` with deterministic CI progress and persist findings.
#   3. Export findings JSON and a markdown PR/security review comment.
#
# The workflow is NOT wired into Kuzushi's own CI; it is documentation. Copies
# in downstream repos should add `pull_request` / `push` triggers as needed.

name: Kuzushi Security Scan (reference)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install Kuzushi
        run: npm install -g kuzushi

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Kuzushi doctor
        if: always()
        run: kuzushi doctor --target . --json > kuzushi-doctor.json

      - name: Run Kuzushi scan
        id: kuzushi
        shell: bash
        # Exit codes: 0 = clean, 3 = findings at/above --fail-on (the gate),
        # anything else = scanner failure. Tune --fail-on to your policy.
        run: |
          set +e
          kuzushi scan . --mode standard --ci \
            --fail-on high \
            --sarif kuzushi.sarif | tee kuzushi-scan.log
          KUZUSHI_STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=${KUZUSHI_STATUS}" >> "${GITHUB_OUTPUT}"

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('kuzushi.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: kuzushi.sarif
          category: kuzushi

      - name: Export findings JSON
        if: always()
        run: kuzushi findings --target . --json > kuzushi-findings.json

      - name: Render PR comment markdown
        if: always()
        run: |
          kuzushi pr-comment \
            --target . \
            --repo "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --git-sha "${GITHUB_SHA}" \
            > kuzushi-report.md

      - name: Upload Kuzushi artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kuzushi-security-scan
          path: |
            kuzushi-doctor.json
            kuzushi-scan.log
            kuzushi-findings.json
            kuzushi-report.md
            kuzushi.sarif
          if-no-files-found: warn

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('kuzushi-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: kuzushi-scan
          path: kuzushi-report.md

      - name: Propagate Kuzushi exit code
        if: always()
        # shellcheck SC2242 fires because the static analyser cannot
        # verify the GitHub expression collapses to a 0–255 integer.
        # Guard with a numeric check; default to 1 on anything else.
        run: |
          status="${{ steps.kuzushi.outputs.status || 1 }}"
          case "$status" in
            ''|*[!0-9]*) status=1 ;;
          esac
          exit "$status"
