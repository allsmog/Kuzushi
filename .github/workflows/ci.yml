name: CI

on:
  # Do not run on every pushed commit. One quick pass when review starts, plus
  # merge-queue and main validation, bounds routine Actions usage by PR count.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""

concurrency:
  group: ci-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.3.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Draft PRs do not allocate a runner. Marking one ready is its explicit CI
  # request; later commit pushes are intentionally not subscribed above.
  quality-gauntlet:
    name: quality-gauntlet
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Reject newly introduced Anthropic-shaped credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='sk-ant-(api|oat)[0-9]+-[A-Za-z0-9_-]{20,}'
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            matches=$(git diff origin/main..HEAD --unified=0 --no-color | \
              grep -E '^\+' | grep -E "$pattern" || true)
          else
            matches=$(grep -rEn --color=never \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.git \
              --exclude-dir=generated \
              "$pattern" . || true)
          fi
          if [ -n "$matches" ]; then
            echo "::error::Anthropic-shaped credential pattern found:"
            echo "$matches"
            exit 1
          fi
      - name: Run quick repository contract
        env:
          KUZUSHI_CRAP_RISK_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm verify:quick:summary
