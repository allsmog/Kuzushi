name: CI

on:
  # Run one quick pass when review starts and again for each later PR head.
  # Drafts still skip runner allocation below; merge-queue and main validation
  # keep the exact SHA that may merge or ship bound to a fresh receipt.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""

concurrency:
  group: ci-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.3.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Draft PRs do not allocate a runner. Marking one ready is its first CI
  # request; synchronize then keeps later ready-PR heads covered exactly.
  quality-gauntlet:
    name: quality-gauntlet
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Run quick repository contract
        env:
          KUZUSHI_CRAP_RISK_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm verify:quick:summary
