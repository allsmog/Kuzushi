name: CI

on:
  # Run one quick pass when review starts and again for each later PR head.
  # Drafts still skip runner allocation below; the merge queue keeps the exact
  # SHA that may merge bound to a fresh receipt.
  #
  # There is deliberately no `push: branches: [main]` trigger. Every commit
  # that reaches main already passed this workflow on its pull request head or
  # in the merge queue, so a post-merge rerun bought a second receipt for an
  # already-validated tree at full runner cost. Release trees are revalidated
  # by release-candidate.yml, which calls ci-full.yml against the exact
  # candidate SHA.
  #
  # `paths-ignore` skips a run only when EVERY changed file matches, so a
  # mixed documentation-and-code pull request still runs the gauntlet. The
  # list is prose-only on purpose: `.github/**`, `scripts/**`, `crates/**`,
  # `Cargo.lock`, `pnpm-lock.yaml`, and `package.json` are never ignored,
  # because a path filter must never become a way to land executable or
  # workflow changes without a receipt.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plans/**"
      - "design/**"
  merge_group:
  workflow_dispatch:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
      hosted:
        description: Run on GitHub-hosted ubuntu-latest instead of the self-hosted Mac
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
      hosted:
        description: Run on GitHub-hosted ubuntu-latest instead of the self-hosted Mac
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.3.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Draft PRs do not allocate a runner. Marking one ready is its first CI
  # request; synchronize then keeps later ready-PR heads covered exactly.
  #
  # `runs-on` defaults to the owner's ephemeral self-hosted Apple-Silicon
  # runner (labels `self-hosted, macOS, ARM64, kuzushi-mac`) so a routine pull
  # request costs no hosted minutes. `hosted: true` flips the job back to
  # `ubuntu-latest` for callers that must not depend on that machine being
  # online. Both branches of the expression are JSON arrays so the value has
  # one type either way.
  #
  # Nothing this job runs is Linux-specific: `pnpm verify:quick:summary` is
  # exactly what the owner already runs locally. macOS and `ubuntu-latest` do
  # produce different `cargo` target directories, so the two runners never
  # share a build cache; each keeps its own.
  quality-gauntlet:
    name: quality-gauntlet
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          cache: true
      - run: pnpm install --frozen-lockfile
      # The Docker path only exists for `hosted: true`, because the
      # GitHub-hosted ubuntu image is the only runner here with a daemon
      # running. The self-hosted Mac has none, so it lints with the native
      # binary at the same pinned version.
      - name: Lint GitHub Actions workflows (hosted, Docker)
        if: ${{ inputs.hosted }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Lint GitHub Actions workflows (native binary)
        if: ${{ !inputs.hosted }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: bash scripts/runner/lint-workflows.sh
      - name: Run quick repository contract
        env:
          KUZUSHI_CRAP_RISK_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm verify:quick:summary
