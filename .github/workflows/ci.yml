name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
  workflow_call:

# Cancel in-progress CI runs on the same PR branch; keep main pushes running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.88.0"

jobs:
  # ── Shared install: warms the pnpm store cache for dependent jobs ─────────
  # Each dependent job re-runs `pnpm install --frozen-lockfile` but with a
  # warm store hits local cache; splitting the work across parallel runners
  # is still a net win over a single serial job.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # ── Lint + format check (parallel after install) ─────────────────────────
  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality:crap-risk
      - run: pnpm quality:identity
      - run: pnpm quality:architecture
      - run: pnpm quality:model-safety
      - run: pnpm check:docs
      - run: pnpm check

  # ── Codegen drift check (parallel after install) ──────────────────────────
  codegen-check:
    name: codegen-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check

  # ── Type-check (parallel after install) ───────────────────────────────────
  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types

  # ── Rust lint: formatting + clippy (deny-level lints fail the build) ──────
  rust-lint:
    name: rust-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  # ── Rust CLI build + tests ───────────────────────────────────────────────
  rust-cli:
    name: rust-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: cargo build -p kuzushi-cli --release
      - run: node scripts/stage-native-binary.mjs
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # ── Tests with coverage inline (parallel after install) ──────────────────
  # `test:coverage` is a superset of `test` — we do not run both.
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ── Build and publish dist/ as artifact for downstream jobs ───────────────
  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Verify the packed tarball is consistent (after build) ────────────────
  verify-pack:
    name: verify-pack
    needs: [build, rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/
      - run: pnpm verify:pack

  # ── E2E smoke against native artifact ────────────────────────────────────
  # Uses KUZUSHI_CMD env to point the smoke script at the native wrapper, so
  # the shipped npm path exercises the Rust binary instead of the legacy TS CLI.
  #
  # M1 §1.5: this job is now a hard gate (no `continue-on-error`). The three
  # historical sources of flake are all defended:
  #
  #   1. `triage:assertions` FK fault — the legacy TS `store-worker` is gone
  #      and the FK invariant on the `triage(finding_id)` column is covered
  #      by the Rust regressions
  #      `save_triage_against_missing_finding_id_returns_clean_fk_error` and
  #      `save_triage_after_finding_insert_succeeds_with_dedup_safe_id` in
  #      `crates/kuzushi-core/src/findings/tests.rs`. SQLite enforces the
  #      constraint, so any future caller that races the inserts surfaces a
  #      clean Err instead of silently corrupting state.
  #   2. Semgrep registry reachability — `tests/e2e/run-smoke.sh` points the
  #      scanner at the vendored ruleset under
  #      `tests/e2e/fixtures/semgrep-rules/` instead of `--config auto`,
  #      so the run does not depend on the public registry being up.
  #   3. ANTHROPIC_API_KEY precondition — the smoke script now exports
  #      `ANTHROPIC_API_KEY=fake-key` before invoking the CLI so credential
  #      preflight passes deterministically (the mock server ignores it).
  #
  # If this job goes red, treat it as a real regression — investigate before
  # re-introducing `continue-on-error: true`.
  e2e:
    name: e2e
    needs: [build, rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/
      - name: Run smoke tests against native CLI
        env:
          KUZUSHI_CMD: node bin/kuzushi-rs.mjs
        run: pnpm test:e2e
