name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
  workflow_call:

# Cancel in-progress CI runs on the same PR branch; keep main pushes running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # KWP tests exercise permission-mode network denial and require the June
  # 2026 permission-model fixes on Linux runners.
  NODE_VERSION: "26.3.1"
  PYTHON_VERSION: "3.12"
  # Run JS-based actions on Node 24 ahead of the June 2026 default flip
  # (Node 20 action runtimes are deprecated on GitHub-hosted runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Shared install: warms the pnpm store cache for dependent jobs ─────────
  # Each dependent job re-runs `pnpm install --frozen-lockfile` but with a
  # warm store hits local cache; splitting the work across parallel runners
  # is still a net win over a single serial job.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # ── Lint + format check (parallel after install) ─────────────────────────
  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The CRAP-risk gate diffs HEAD^..HEAD on clean checkouts; a depth-1
          # clone has no HEAD^ and the gate now fails loudly instead of
          # silently checking 0 files.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality:crap-risk
      - run: pnpm quality:identity
      - run: pnpm quality:architecture
      - run: pnpm quality:model-safety
      # check-port-contract.mjs requires the upstream-codex remote to exist
      # (sync policy in UPSTREAM_CODEX.md); fresh CI clones only have origin.
      - run: git remote add upstream-codex https://github.com/openai/codex.git
      - run: pnpm check:docs
      - run: pnpm check

  # ── Codegen drift check (parallel after install) ──────────────────────────
  codegen-check:
    name: codegen-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check

  # ── Type-check (parallel after install) ───────────────────────────────────
  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types

  # ── Rust lint: clippy as a hard gate ─────────────────────────────────────
  # clippy is hard-blocking via the workspace `[workspace.lints.clippy]`
  # baseline in Cargo.toml. `cargo fmt --check` is intentionally NOT a hard
  # gate yet: the tree carries pre-existing rustfmt drift, and a workspace-wide
  # `cargo fmt` would churn dozens of files and re-touch pre-existing
  # over-complexity functions, tripping the CRAP-risk gate on the diff. The
  # check runs for visibility but does not fail the build; promote it to hard
  # once a dedicated formatting-only PR lands and the drift is zero.
  rust-lint:
    name: rust-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustfmt drift (informational)
        continue-on-error: true
        run: cargo fmt --all --check

  # ── Dependency advisories, license policy, duplicate bans ────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # ── Rust CLI build + tests ───────────────────────────────────────────────
  rust-cli:
    name: rust-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: node scripts/build-native-runtime.mjs
      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # ── Tests with coverage inline (parallel after install) ──────────────────
  # `test:coverage` is a superset of `test` — we do not run both.
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ── Build and publish dist/ as artifact for downstream jobs ───────────────
  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Verify the packed tarball is consistent (after build) ────────────────
  verify-pack:
    name: verify-pack
    needs: [build, rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/
      # download-artifact does not preserve the executable bit; verify:pack
      # asserts the shipped binary is executable, so restore it.
      - run: chmod -R +x native/
      - run: pnpm verify:pack

  # ── E2E smoke against native artifact ────────────────────────────────────
  # Uses KUZUSHI_CMD env to point the smoke script at the native wrapper, so
  # the shipped npm path exercises the Rust binary instead of the legacy TS CLI.
  #
  # Hard-blocking. All three documented sources of flake were removed:
  #
  #   1. `triage:assertions` FK fault — the legacy TS `store-worker` is gone
  #      and the FK invariant on the `triage(finding_id)` column is covered
  #      by the Rust regressions
  #      `save_triage_against_missing_finding_id_returns_clean_fk_error` and
  #      `save_triage_after_finding_insert_succeeds_with_dedup_safe_id` in
  #      `crates/kuzushi-core/src/findings/tests.rs`. SQLite enforces the
  #      constraint, so any future caller that races the inserts surfaces a
  #      clean Err instead of silently corrupting state.
  #   2. Semgrep registry reachability — `tests/e2e/run-smoke.sh` points the
  #      scanner at the vendored ruleset under
  #      `tests/e2e/fixtures/semgrep-rules/` instead of `--config auto`,
  #      so the run does not depend on the public registry being up.
  #   3. ANTHROPIC_API_KEY precondition — the smoke script now exports
  #      `ANTHROPIC_API_KEY=fake-key` before invoking the CLI so credential
  #      preflight passes deterministically (the mock server ignores it).
  #
  # If this job fails, treat it as a real regression in the shipped npm
  # path — do not re-add `continue-on-error` (field-test issue #54).
  e2e:
    name: e2e
    needs: [build, rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/
      - name: Run smoke tests against native CLI
        env:
          KUZUSHI_CMD: node bin/kuzushi-rs.mjs
        run: pnpm test:e2e
