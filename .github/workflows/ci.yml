name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_call:

# Cancel in-progress CI runs on the same PR branch; keep main pushes running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Shared install: warms the pnpm store cache for dependent jobs ─────────
  # Each dependent job re-runs `pnpm install --frozen-lockfile` but with a
  # warm store hits local cache; splitting the work across parallel runners
  # is still a net win over a single serial job.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # ── Lint + format check (parallel after install) ─────────────────────────
  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # ── Codegen drift check (parallel after install) ──────────────────────────
  codegen-check:
    name: codegen-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check

  # ── Type-check (parallel after install) ───────────────────────────────────
  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types

  # ── Tests with coverage inline (parallel after install) ──────────────────
  # `test:coverage` is a superset of `test` — we do not run both.
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ── Build and publish dist/ as artifact for downstream jobs ───────────────
  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Verify the packed tarball is consistent (after build) ────────────────
  verify-pack:
    name: verify-pack
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm verify:pack

  # ── E2E smoke against built dist artifact (not tsx) ──────────────────────
  # Uses KUZUSHI_CMD env to point the smoke script at the built CLI instead
  # of `pnpm dev` (tsx), so we catch TS-only bugs before release.
  #
  # Currently non-blocking (`continue-on-error: true`): the smoke harness
  # depends on a mock Anthropic server + the pi-ai backend, and on
  # internet access for the semgrep rule registry. The historical
  # `triage:assertions` FK fault (pipeline_runs row not present when the
  # assertion worker fires) is now defended in store-worker via a
  # widened try/catch — see `swallows triage:assertions FK failures …`
  # in tests/bus/store-worker.test.ts. Once the remaining harness
  # flakes (semgrep registry reachability, mock-server readiness)
  # stabilize, drop `continue-on-error: true`.
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run smoke tests against built dist
        env:
          KUZUSHI_CMD: node dist/cli.js
        run: pnpm test:e2e
