name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      private_cpg:
        description: Run the credentialed full-workspace CPG, package, and e2e gates
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      private_cpg:
        description: Run the credentialed full-workspace CPG, package, and e2e gates
        required: false
        type: boolean
        default: true
    secrets:
      OXIDIZED_JOERN_TOKEN:
        description: Read-only token for the pinned private oxidized-joern dependency
        required: false

# Cancel in-progress CI runs on the same PR branch; keep main pushes running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # KWP tests exercise permission-mode network denial and require the June
  # 2026 permission-model fixes on Linux runners.
  NODE_VERSION: "26.3.1"
  PYTHON_VERSION: "3.12"
  # Run JS-based actions on Node 24 ahead of the June 2026 default flip
  # (Node 20 action runtimes are deprecated on GitHub-hosted runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Shared install: warms the pnpm store cache for dependent jobs ─────────
  # Each dependent job re-runs `pnpm install --frozen-lockfile` but with a
  # warm store hits local cache; splitting the work across parallel runners
  # is still a net win over a single serial job.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # ── Lint + format check (parallel after install) ─────────────────────────
  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The risk gate covers the complete PR/push range, not only HEAD^.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Check CRAP risk across the complete change
        env:
          KUZUSHI_CRAP_RISK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm quality:crap-risk
      - run: pnpm quality:identity
      - run: pnpm quality:architecture
      - run: pnpm quality:model-safety
      # check-port-contract.mjs requires the upstream-codex remote to exist
      # (sync policy in UPSTREAM_CODEX.md); fresh CI clones only have origin.
      - run: git remote add upstream-codex https://github.com/openai/codex.git
      - run: pnpm check:docs
      - run: pnpm check

  # ── Credential-free public/core Rust contract ────────────────────────────
  # Direct push/PR CI always runs this lane. It compiles every kuzushi-core
  # target with the private engine feature disabled and executes the explicit
  # fail-closed adapter tests, without reading any cross-repository secret.
  rust-core:
    name: rust-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - run: bash scripts/check-public-rust-core.sh

  # ── Full Rust lint: private CPG + clippy as a hard release gate ──────────
  # Reusable release CI and an explicit workflow dispatch opt into this lane.
  # Missing private credentials still fail before any full-workspace claim.
  rust-lint:
    name: rust-lint
    if: ${{ inputs.private_cpg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Configure pinned private Rust dependency
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OXIDIZED_JOERN_TOKEN:-}" ]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is required for the pinned private CPG dependency"
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt
        run: cargo fmt --all --check

  # ── Dependency advisories, license policy, duplicate bans ────────────────
  cargo-deny:
    name: cargo-deny
    if: ${{ inputs.private_cpg }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned private Rust dependency
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OXIDIZED_JOERN_TOKEN:-}" ]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is required for the pinned private CPG dependency"
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # ── Full Rust CLI build + tests ──────────────────────────────────────────
  rust-cli:
    name: rust-cli
    if: ${{ inputs.private_cpg }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Configure pinned private Rust dependency
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OXIDIZED_JOERN_TOKEN:-}" ]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is required for the pinned private CPG dependency"
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install patch-validation sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /etc/apparmor.d/usr.bin.bwrap >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace /etc/apparmor.d/usr.bin.bwrap
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev -- /bin/true
      - run: cargo test --workspace --locked
      - run: pnpm test:performance
      - run: cargo build --workspace --locked
      - run: node scripts/build-native-runtime.mjs
      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # The published package supports Node 22+, while the primary jobs exercise
  # the forward-compatibility lane on Node 26. Keep the declared minimum honest
  # before a release tag by running the complete package contract on Node 22.
  node22-compat:
    name: node22-compat
    needs: rust-cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/
      - run: chmod -R +x native/
      - run: pnpm test
      - run: pnpm verify:pack

  # ── Node contract tests (parallel after install) ─────────────────────────
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ── Measured coverage: direct Node boundaries + changed executable Rust ──
  coverage:
    name: coverage
    if: ${{ inputs.private_cpg }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Configure pinned private Rust dependency
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OXIDIZED_JOERN_TOKEN:-}" ]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is required for the pinned private CPG dependency"
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Install patch-validation sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /etc/apparmor.d/usr.bin.bwrap >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace /etc/apparmor.d/usr.bin.bwrap
      - name: Enforce measured coverage
        env:
          KUZUSHI_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-coverage
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
          retention-days: 14

  # ── Deterministic changed-code mutation sample ───────────────────────────
  mutation:
    name: mutation
    needs: [install, rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Configure pinned private Rust dependency
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OXIDIZED_JOERN_TOKEN:-}" ]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is required for the pinned private CPG dependency"
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install mutation tool
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Require sampled changed mutants to be caught
        env:
          KUZUSHI_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm test:mutations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-results
          path: target/mutation/
          if-no-files-found: error
          retention-days: 14

  # ── Verify the packed tarball is consistent (after native build) ─────────
  verify-pack:
    name: verify-pack
    needs: [rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/
      # download-artifact does not preserve the executable bit; verify:pack
      # asserts the shipped binary is executable, so restore it.
      - run: chmod -R +x native/
      - run: pnpm verify:pack

  # ── E2E smoke against native artifact ────────────────────────────────────
  # Uses KUZUSHI_CMD env to point the smoke script at the native wrapper, so
  # the shipped npm path exercises the Rust binary instead of the legacy TS CLI.
  #
  # Hard-blocking. All three documented sources of flake were removed:
  #
  #   1. `triage:assertions` FK fault — the legacy TS `store-worker` is gone
  #      and the FK invariant on the `triage(finding_id)` column is covered
  #      by the Rust regressions
  #      `save_triage_against_missing_finding_id_returns_clean_fk_error` and
  #      `save_triage_after_finding_insert_succeeds_with_dedup_safe_id` in
  #      `crates/kuzushi-core/src/findings/tests.rs`. SQLite enforces the
  #      constraint, so any future caller that races the inserts surfaces a
  #      clean Err instead of silently corrupting state.
  #   2. Semgrep registry reachability — `tests/e2e/run-smoke.sh` points the
  #      scanner at the vendored ruleset under
  #      `tests/e2e/fixtures/semgrep-rules/` instead of `--config auto`,
  #      so the run does not depend on the public registry being up.
  #   3. ANTHROPIC_API_KEY precondition — the smoke script now exports
  #      `ANTHROPIC_API_KEY=fake-key` before invoking the CLI so credential
  #      preflight passes deterministically (the mock server ignores it).
  #
  # If this job fails, treat it as a real regression in the shipped npm
  # path — do not re-add `continue-on-error` (field-test issue #54).
  e2e:
    name: e2e
    needs: [rust-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/
      - name: Run smoke tests against native CLI
        env:
          KUZUSHI_CMD: node bin/kuzushi-rs.mjs
        run: pnpm test:e2e

  # One stable branch-protection context. Direct PR/push CI requires the
  # credential-free core contract. Reusable release/manual full mode also
  # requires every private CPG, package, coverage, mutation, and e2e gate.
  quality-gauntlet:
    name: quality-gauntlet
    if: always()
    needs:
      - lint
      - rust-core
      - rust-lint
      - cargo-deny
      - rust-cli
      - node22-compat
      - test
      - coverage
      - mutation
      - verify-pack
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable quality gate
        env:
          PRIVATE_CPG: ${{ inputs.private_cpg }}
          LINT: ${{ needs.lint.result }}
          RUST_CORE: ${{ needs.rust-core.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          CARGO_DENY: ${{ needs.cargo-deny.result }}
          RUST_CLI: ${{ needs.rust-cli.result }}
          NODE22: ${{ needs.node22-compat.result }}
          NODE_TESTS: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          MUTATION: ${{ needs.mutation.result }}
          PACK: ${{ needs.verify-pack.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          failed=0
          for gate in LINT RUST_CORE NODE_TESTS; do
            result="${!gate}"
            if [ "${result}" != "success" ]; then
              echo "::error::${gate} ended ${result}"
              failed=1
            fi
          done

          private_gates=(RUST_LINT CARGO_DENY RUST_CLI NODE22 COVERAGE MUTATION PACK E2E)
          if [ "${PRIVATE_CPG:-false}" = "true" ]; then
            for gate in "${private_gates[@]}"; do
              result="${!gate}"
              if [ "${result}" != "success" ]; then
                echo "::error::${gate} ended ${result} in required private-CPG mode"
                failed=1
              fi
            done
          else
            for gate in "${private_gates[@]}"; do
              result="${!gate}"
              if [ "${result}" != "skipped" ]; then
                echo "::error::${gate} unexpectedly ended ${result} in public-core mode"
                failed=1
              fi
            done
          fi
          exit "${failed}"
