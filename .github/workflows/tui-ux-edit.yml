name: TUI UX branch source

on:
  push:
    branches: [daily/2026-09-06-tui-ux-contracts]
    paths: [.github/workflows/tui-ux-edit.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'allsmog/Kuzushi' && github.ref == 'refs/heads/daily/2026-09-06-tui-ux-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive only tracked source, never credentials or runtime state
        run: git archive --format=tar.gz HEAD > /tmp/kuzushi-ux-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: kuzushi-ux-source
          path: /tmp/kuzushi-ux-source.tar.gz
          retention-days: 1
