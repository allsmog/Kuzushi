name: Juice Shop 20x Kuzushi campaign

on:
  push:
    branches:
      - agent/juice-shop-deep-campaign
  workflow_dispatch:

concurrency:
  group: juice-shop-20x-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "26.3.1"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.96.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KUZUSHI_REPO: ${{ github.workspace }}
  CAMPAIGN_ROOT: ${{ github.workspace }}/.campaign/${{ github.run_id }}
  TARGET_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/juice-shop
  AFE_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/agentic-fuzz-engine
  OXIDIZED_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/oxidized-joern/latest
  OXIDIZED_PINNED_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/oxidized-joern/pinned
  REPORT_DIR: /tmp/juice-shop-20x-${{ github.run_id }}/reports
  VENV_DIR: /tmp/juice-shop-20x-${{ github.run_id }}/venv
  CAMPAIGN_HOME: /tmp/juice-shop-20x-${{ github.run_id }}/home
  KUZUSHI_OAUTH_CREDENTIALS: /tmp/juice-shop-20x-${{ github.run_id }}/home/.kuzushi/oauth-credentials.json
  TARGET_SHA: 640d727a94e5aaaca37d36d8a690bce074b80369
  TARGET_BASE_SHA: bd2611f6cac491bb80c9fe54e954fd945c3ab5ba
  AFE_SHA: d480b9429c7889b9692ccb062ee624dd23ba36ec
  OXIDIZED_SHA: f74c237c236971ee4df03e5f82375469b91ca9af
  OXIDIZED_PINNED_SHA: 9ab43859f0c3342c734ff38ea6366711d216c8fd
  KUZUSHI_MODEL: openai-codex:gpt-5.3-codex-spark
  RELAY_ISSUE: "153"

jobs:
  campaign:
    name: 20 independent scans, triage, and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out Kuzushi campaign branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out exact Juice Shop PR commit
        uses: actions/checkout@v7
        with:
          repository: allsmog/juice-shop
          ref: ${{ env.TARGET_SHA }}
          path: .campaign/${{ github.run_id }}/juice-shop
          fetch-depth: 2
          persist-credentials: false

      - name: Reclaim and verify runner disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /usr/local/lib/heroku \
            /usr/local/aws-cli \
            /opt/microsoft \
            /usr/lib/jvm || true
          sudo apt-get clean
          docker system prune --all --force || true
          echo "Disk after cleanup:"
          df -h /
          available_gib=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [[ -z "$available_gib" || "$available_gib" -lt 35 ]]; then
            echo "::error::Campaign requires at least 35 GiB free after cleanup; found ${available_gib:-unknown} GiB."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUST_VERSION" \
            --component clippy \
            --component rustfmt \
            --component llvm-tools-preview
          rustup default "$RUST_VERSION"
          rustc -Vv
          cargo -V
          df -h /

      - name: Validate campaign source before accepting private material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR" "$CAMPAIGN_HOME/.kuzushi" "$CAMPAIGN_ROOT"
          bash -n .github/scripts/build-juice-shop-deep-campaign.sh
          bash -n .github/scripts/juice-shop-20x-campaign.sh
          node --check .github/scripts/deep-campaign-bundle-relay.mjs
          node --check .github/scripts/deep-campaign-oauth-relay.mjs
          node --check .github/scripts/juice-shop-runtime-probes.mjs
          python3 -m py_compile \
            .github/scripts/prepare-juice-shop-20x-plan.py \
            .github/scripts/select-juice-shop-verification.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(
              Path(".github/campaign/juice-shop-threat-model.json").read_text(encoding="utf-8")
          )
          threats = model.get("threats")
          if not isinstance(threats, list) or len(threats) != 5:
              raise SystemExit("threat model must contain exactly five threats")
          ids = [row.get("id") for row in threats]
          if len(set(ids)) != 5 or any(not value for value in ids):
              raise SystemExit("threat ids must be five unique non-empty values")
          for prompt in (
              ".github/campaign/juice-shop-triage-prompt.md",
              ".github/campaign/juice-shop-verify-prompt.md",
          ):
              if len(Path(prompt).read_text(encoding="utf-8").strip()) < 500:
                  raise SystemExit(f"{prompt} is unexpectedly short")
          PY

      - name: Receive checksum-verified private source bundles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deep-campaign-bundle-relay.mjs

      - name: Authorize ephemeral GPT-5.3 Codex Monorepo bridge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deep-campaign-oauth-relay.mjs

      - name: Build integrated Kuzushi, AFE, and CPG toolchain
        shell: bash
        run: bash .github/scripts/build-juice-shop-deep-campaign.sh

      - name: Run 20-scan campaign, triage, and verification
        shell: bash
        env:
          HOME: ${{ env.CAMPAIGN_HOME }}
          XDG_CONFIG_HOME: ${{ env.CAMPAIGN_HOME }}/.config
          XDG_DATA_HOME: ${{ env.CAMPAIGN_HOME }}/.local/share
          XDG_CACHE_HOME: ${{ env.CAMPAIGN_HOME }}/.cache
        run: bash .github/scripts/juice-shop-20x-campaign.sh

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: juice-shop-20x-kuzushi-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          compression-level: 6

      - name: Publish campaign outcome to relay issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CPG_MODE: ${{ env.CPG_INTEGRATION_MODE }}
        with:
          script: |
            const status = process.env.JOB_STATUS;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const cpg = process.env.CPG_MODE || 'not reached';
            const body = [
              `<!-- juice-shop-20x-campaign-result:${context.runId} -->`,
              `Juice Shop 20× campaign **${status}** for run ${context.runId}.`,
              `Requested workload: 20 independent Monorepo scans, cross-run dedupe, five-vote deep triage, model verification, and bounded empirical testing.`,
              `CPG integration mode: \`${cpg}\`.`,
              `Run and evidence artifact: ${run}`,
              `No OAuth credentials, private artifact URL, local Juice Shop token, or target source mutation was persisted.`,
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELAY_ISSUE),
              body,
            });

      - name: Remove temporary credentials and checkouts
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$KUZUSHI_OAUTH_CREDENTIALS"
          rm -rf "$CAMPAIGN_HOME" "$VENV_DIR" "$CAMPAIGN_ROOT"
          docker ps -aq --filter 'name=juice-shop-20x-' | xargs -r docker rm --force
          docker network ls --format '{{.Name}}' | grep '^juice-shop-20x-' | xargs -r docker network rm
          exit 0
