name: Juice Shop deep Kuzushi campaign

on:
  push:
    branches:
      - agent/juice-shop-deep-campaign
  workflow_dispatch:

concurrency:
  group: juice-shop-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "26.3.1"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KUZUSHI_REPO: ${{ github.workspace }}
  CAMPAIGN_ROOT: ${{ github.workspace }}/.campaign/${{ github.run_id }}
  TARGET_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/juice-shop
  AFE_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/agentic-fuzz-engine
  OXIDIZED_DIR: ${{ github.workspace }}/.campaign/${{ github.run_id }}/oxidized-joern
  REPORT_DIR: ${{ runner.temp }}/juice-shop-deep-${{ github.run_id }}/reports
  VENV_DIR: ${{ runner.temp }}/juice-shop-deep-${{ github.run_id }}/venv
  CAMPAIGN_HOME: ${{ runner.temp }}/juice-shop-deep-${{ github.run_id }}/home
  KUZUSHI_OAUTH_CREDENTIALS: ${{ runner.temp }}/juice-shop-deep-${{ github.run_id }}/home/.kuzushi/oauth-credentials.json
  TARGET_SHA: 640d727a94e5aaaca37d36d8a690bce074b80369
  TARGET_BASE_SHA: bd2611f6cac491bb80c9fe54e954fd945c3ab5ba
  AFE_SHA: d480b9429c7889b9692ccb062ee624dd23ba36ec
  OXIDIZED_SHA: f74c237c236971ee4df03e5f82375469b91ca9af
  KUZUSHI_MODEL: openai-codex:gpt-5.3-codex-spark
  RELAY_ISSUE: "153"
  CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.OXIDIZED_JOERN_TOKEN }}

jobs:
  deep-campaign:
    name: isolated full campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Kuzushi campaign branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require cross-repository read credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSS_REPO_TOKEN:-}" ]]; then
            echo "::error::CROSS_REPO_READ_TOKEN or OXIDIZED_JOERN_TOKEN is required to clone the two private integration repositories."
            exit 1
          fi

      - name: Check out exact Juice Shop PR commit
        uses: actions/checkout@v7
        with:
          repository: allsmog/juice-shop
          ref: ${{ env.TARGET_SHA }}
          path: .campaign/${{ github.run_id }}/juice-shop
          fetch-depth: 2
          persist-credentials: false

      - name: Check out exact Agentic Fuzz Engine commit
        uses: actions/checkout@v7
        with:
          repository: allsmog/agentic-fuzz-engine
          ref: ${{ env.AFE_SHA }}
          token: ${{ env.CROSS_REPO_TOKEN }}
          path: .campaign/${{ github.run_id }}/agentic-fuzz-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Oxidized Joern commit
        uses: actions/checkout@v7
        with:
          repository: allsmog/oxidized-joern
          ref: ${{ env.OXIDIZED_SHA }}
          token: ${{ env.CROSS_REPO_TOKEN }}
          path: .campaign/${{ github.run_id }}/oxidized-joern
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true

      - name: Validate orchestration source before authorization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR" "$CAMPAIGN_HOME/.kuzushi"
          bash -n .github/scripts/build-juice-shop-deep-campaign.sh
          bash -n .github/scripts/juice-shop-deep-campaign.sh
          node --check .github/scripts/deep-campaign-oauth-relay.mjs

      - name: Authorize the ephemeral GPT-5.3 Codex Monorepo bridge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deep-campaign-oauth-relay.mjs

      - name: Build integrated Kuzushi, AFE, and CPG toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${CROSS_REPO_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          set +e
          bash .github/scripts/build-juice-shop-deep-campaign.sh
          code=$?
          set -e
          git config --global --unset-all \
            url."https://x-access-token:${CROSS_REPO_TOKEN}@github.com/".insteadOf || true
          exit "$code"

      - name: Run isolated full campaign
        shell: bash
        env:
          HOME: ${{ env.CAMPAIGN_HOME }}
          XDG_CONFIG_HOME: ${{ env.CAMPAIGN_HOME }}/.config
          XDG_DATA_HOME: ${{ env.CAMPAIGN_HOME }}/.local/share
          XDG_CACHE_HOME: ${{ env.CAMPAIGN_HOME }}/.cache
        run: bash .github/scripts/juice-shop-deep-campaign.sh

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: juice-shop-deep-kuzushi-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}
            ${{ env.TARGET_DIR }}/.kuzushi
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3
          compression-level: 6

      - name: Publish campaign outcome to relay issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CPG_MODE: ${{ env.CPG_INTEGRATION_MODE }}
        with:
          script: |
            const status = process.env.JOB_STATUS;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const cpg = process.env.CPG_MODE || 'not reached';
            const body = [
              `<!-- juice-shop-deep-campaign-result:${context.runId} -->`,
              `Deep Juice Shop campaign **${status}** for run ${context.runId}.`,
              `CPG integration mode: \`${cpg}\`.`,
              `Run and evidence artifact: ${run}`,
              `No OAuth credentials or local Juice Shop tokens were persisted.`,
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELAY_ISSUE),
              body,
            });

      - name: Remove temporary credentials and checkouts
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$KUZUSHI_OAUTH_CREDENTIALS"
          rm -rf "$CAMPAIGN_HOME" "$VENV_DIR" "$CAMPAIGN_ROOT"
          git config --global --unset-all \
            url."https://x-access-token:${CROSS_REPO_TOKEN}@github.com/".insteadOf 2>/dev/null || true
          docker ps -aq --filter 'name=juice-shop-deep-' | xargs -r docker rm --force
          docker network ls --format '{{.Name}}' | grep '^juice-shop-deep-' | xargs -r docker network rm
          exit 0
