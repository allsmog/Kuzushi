name: Full product CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  private-source-contract:
    name: private-source-contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
      - name: Configure least-privilege private dependency access
        env:
          OXIDIZED_JOERN_TOKEN: ${{ secrets.OXIDIZED_JOERN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${OXIDIZED_JOERN_TOKEN:-}" ]]; then
            echo "::error::OXIDIZED_JOERN_TOKEN is missing. Configure a read-only fine-grained token scoped only to allsmog/oxidized-joern contents."
            exit 1
          fi
          git config --global url."https://x-access-token:${OXIDIZED_JOERN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Verify exact private source resolution
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/cargo-metadata.json"
          cargo metadata --format-version 1 --locked > "${metadata}"
          python3 - "${metadata}" <<'PY'
          import json
          import sys

          expected = "git+https://github.com/allsmog/oxidized-joern.git?rev=9ab43859f0c3342c734ff38ea6366711d216c8fd#"
          packages = json.load(open(sys.argv[1], encoding="utf-8"))["packages"]
          required = {"cpg-analysis", "cpg-cli", "cpg-core", "cpg-incremental"}
          seen = {
              package["name"]
              for package in packages
              if package.get("source", "").startswith(expected)
          }
          missing = sorted(required - seen)
          if missing:
              raise SystemExit(f"private CPG metadata missing exact pinned packages: {missing}")
          print(f"resolved exact private CPG packages: {', '.join(sorted(seen))}")
          PY
      - name: Compile the real default-feature CPG adapter
        run: cargo check --package kuzushi-cpg --all-targets --locked
