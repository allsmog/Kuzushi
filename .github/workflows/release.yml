name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: release-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      quality_base_ref: ${{ steps.identity.outputs.quality_base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bind the release tag to current main
        id: identity
        env:
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} must equal ${expected_tag}" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${GITHUB_SHA}" ]]; then
            echo "tag checkout ${checked_out_sha} does not equal event SHA ${GITHUB_SHA}" >&2
            exit 1
          fi
          remote_main_sha="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}')"
          if [[ -z "${remote_main_sha}" || "${remote_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "release tag must point at current origin/${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          quality_base_ref="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -z "${quality_base_ref}" ]]; then
            quality_base_ref="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "quality_base_ref=${quality_base_ref}" >> "${GITHUB_OUTPUT}"

  candidate:
    name: verified-candidate
    needs: preflight
    uses: ./.github/workflows/release-candidate.yml
    with:
      expected_version: ${{ needs.preflight.outputs.version }}
      expected_sha: ${{ github.sha }}
      quality_base_ref: ${{ needs.preflight.outputs.quality_base_ref }}
      # A tag push carries no inputs, so the darwin runner choice is a
      # repository variable. Releases use GitHub-hosted macOS by default; set
      # `KUZUSHI_RELEASE_SELF_HOSTED=true` to run one release on the owner's
      # self-hosted Mac without editing this workflow, and unset it after.
      hosted: ${{ vars.KUZUSHI_RELEASE_SELF_HOSTED != 'true' }}
    permissions:
      contents: read
      actions: read

  publish-npm:
    needs: [preflight, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-artifacts
          path: dist/release
      - name: Rehash the complete candidate before publication
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/verify-release-artifacts.mjs dist/release "${RELEASE_SHA}" "${RELEASE_VERSION}"
      - name: Publish verified npm packages with the thin launcher last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          KUZUSHI_RELEASE_DIRECTORY: dist/release
        run: node scripts/publish-platform-packages.mjs

  github-release:
    needs: [preflight, candidate, publish-npm, promote-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-artifacts
          path: dist/release
      - name: Rehash the complete candidate before release creation
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/verify-release-artifacts.mjs dist/release "${RELEASE_SHA}" "${RELEASE_VERSION}"
      - name: Generate changelog from the previous reachable tag
        env:
          QUALITY_BASE_REF: ${{ needs.preflight.outputs.quality_base_ref }}
        run: |
          set -euo pipefail
          changelog="${RUNNER_TEMP}/changelog.txt"
          git log --pretty=format:"- %s (%h)" "${QUALITY_BASE_REF}..HEAD" > "${changelog}"
          echo "CHANGELOG_PATH=${changelog}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          body_path: ${{ env.CHANGELOG_PATH }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/release-manifest.json
            dist/release/packages/*
            dist/release/native/*
            dist/release/source/*

  published-release-smoke:
    needs: [preflight, publish-npm]
    uses: ./.github/workflows/published-release-smoke.yml
    with:
      version: v${{ needs.preflight.outputs.version }}
      hosted: ${{ vars.KUZUSHI_RELEASE_SELF_HOSTED != 'true' }}
    permissions:
      contents: read

  promote-latest:
    needs: [preflight, published-release-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-artifacts
          path: dist/release
      - name: Promote verified public installs, launcher last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          KUZUSHI_RELEASE_DIRECTORY: dist/release
        run: node scripts/publish-platform-packages.mjs --promote
