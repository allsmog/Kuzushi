name: Export validation source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-validation-source.yml'
      - '.github/workflows/full-product-ci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'crates/kuzushi-cpg/**'
      - 'crates/kuzushi-core/src/modules/registry/tests.rs'
      - 'scripts/check-public-rust-core.sh'

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Archive exact private validation source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            --exclude='.git' \
            --exclude='target' \
            --exclude='node_modules' \
            -czf "${RUNNER_TEMP}/kuzushi-${EXPECTED_HEAD}.tar.gz" .
          sha256sum "${RUNNER_TEMP}/kuzushi-${EXPECTED_HEAD}.tar.gz" \
            | tee "${RUNNER_TEMP}/kuzushi-${EXPECTED_HEAD}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kuzushi-validation-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/kuzushi-${{ github.event.pull_request.head.sha }}.tar.gz
            ${{ runner.temp }}/kuzushi-${{ github.event.pull_request.head.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  offline-public-dependencies:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '26.3.1'
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          cache: false
      - name: Resolve the credential-free public dependency graph
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/kuzushi-offline-public"
          worktree="${scratch}/worktree"
          stubs="${scratch}/resolver-stubs"
          mkdir -p "${scratch}"
          git worktree add --detach "${worktree}" HEAD
          node scripts/public-core-workspace.mjs "${worktree}" "${stubs}"
          (
            cd "${worktree}"
            cargo metadata --format-version 1 --no-default-features > "${scratch}/metadata.json"
            node "${GITHUB_WORKSPACE}/scripts/public-core-cargo-lock.mjs" \
              "${GITHUB_WORKSPACE}/Cargo.lock" Cargo.lock
            if grep -Fq 'github.com/allsmog/oxidized-joern.git' "${scratch}/metadata.json"; then
              echo '::error::offline public dependency metadata contains the private source'
              exit 1
            fi
            cargo fetch --locked
          )
          git worktree remove --force "${worktree}"
      - name: Archive pinned toolchain and public Cargo cache
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/kuzushi-offline-bundle"
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          sysroot="$(rustc --print sysroot)"
          toolchain_name="$(basename "${sysroot}")"
          mkdir -p "${staging}/toolchains" "${staging}/cargo-home"
          cp -a "${sysroot}" "${staging}/toolchains/${toolchain_name}"
          printf '%s\n' "${toolchain_name}" > "${staging}/toolchain-name.txt"
          for directory in registry git; do
            if [[ -d "${cargo_home}/${directory}" ]]; then
              cp -a "${cargo_home}/${directory}" "${staging}/cargo-home/${directory}"
            fi
          done
          if grep -R -F -l 'github.com/allsmog/oxidized-joern.git' "${staging}" >/dev/null; then
            echo '::error::offline public bundle unexpectedly contains the private source URL'
            exit 1
          fi
          archive="${RUNNER_TEMP}/kuzushi-offline-public-${GITHUB_SHA}.tar.gz"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "${archive}" \
            -C "${staging}" .
          sha256sum "${archive}" | tee "${archive}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kuzushi-offline-public-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/kuzushi-offline-public-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/kuzushi-offline-public-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
