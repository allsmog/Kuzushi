name: Supply chain

on:
  # The dependency policy is the one gate whose verdict changes without the
  # tree changing: an advisory published today makes yesterday's commit
  # vulnerable with no diff to review. ci-full.yml runs the same policy, but
  # its only automatic trigger is the first of the month and its `cargo-deny`
  # job sits behind `quality-gauntlet`, so one unrelated red step there skips
  # the policy outright -- which is what happened on 2026-11-01, leaving main
  # with no advisory, license, ban, or source verdict between 2026-10-01 and
  # the next monthly cron. A daily run of its own bounds that gap at one day.
  schedule:
    - cron: "37 6 * * *"
  # A pull request that moves the dependency graph is also gated at review
  # time, which is where a dependency bump's advisory verdict belongs.
  #
  # The `paths` allow-list inverts GitHub's default from run to skip, and
  # ci.yml must never adopt it for exactly that reason. It is safe only here,
  # because this workflow's subject *is* the dependency graph: the daily run
  # covers the default branch unconditionally, so skipping a pull request that
  # touches no manifest, lockfile, policy, or this file loses no coverage.
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately `needs`-free. The point of this workflow is that no other
  # job's success stands between an advisory and the operator reading it.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same action, same pin, same command as ci-full.yml's `cargo-deny` job.
      # This workflow changes when the policy runs, never what it decides.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
