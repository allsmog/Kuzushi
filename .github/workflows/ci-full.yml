name: Full CI

on:
  # One deliberate full run per month catches platform and deep-quality drift
  # without charging every intermediate PR commit for the complete matrix.
  # Releases do not wait for the cron: release-candidate.yml calls this
  # workflow directly against the exact candidate commit.
  schedule:
    - cron: "17 10 1 * *"
  workflow_dispatch:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
      deep:
        description: Also run the long mutation sweep
        required: false
        type: boolean
        default: false
      hosted:
        description: Run on GitHub-hosted ubuntu-latest instead of the self-hosted Mac
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      quality_base_ref:
        description: Explicit Git base for changed-code quality gates
        required: false
        type: string
        default: ""
      deep:
        description: Also run the long mutation sweep
        required: false
        type: boolean
        default: false
      hosted:
        description: Run on GitHub-hosted ubuntu-latest instead of the self-hosted Mac
        required: false
        type: boolean
        default: false

# A full run is deliberate. Serialize it by ref without coupling it to the
# lightweight PR workflow.
concurrency:
  group: ci-full-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.3.1"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Every job below except `windows-compile` runs by default on the owner's
# ephemeral self-hosted Apple-Silicon runner (labels `self-hosted, macOS,
# ARM64, kuzushi-mac`), so a full sweep costs no hosted minutes. Passing
# `hosted: true` flips exactly those jobs back to `ubuntu-latest` for a caller
# that must not depend on that machine being online -- release-candidate.yml
# can request it when the Mac is off. Both branches of the expression are JSON
# arrays so `runs-on` has one type either way.
#
# macOS and `ubuntu-latest` produce different `cargo` target directories, so
# the two runners never share a build cache; each keeps its own. Nothing in
# these jobs is Linux-specific except the patch-validation sandbox action,
# which is a documented no-op off Linux (see the rust-cli disclosure step).
jobs:
  # Fail fast before starting the expensive cross-platform fan-out.
  quality-gauntlet:
    name: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      - run: pnpm install --frozen-lockfile
      # The Docker path only exists for `hosted: true`, because the
      # GitHub-hosted ubuntu image is the only runner here with a daemon
      # running. The self-hosted Mac has none, so it lints with the native
      # binary at the same pinned version.
      - name: Lint GitHub Actions workflows (hosted, Docker)
        if: ${{ inputs.hosted }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Lint GitHub Actions workflows (native binary)
        if: ${{ !inputs.hosted }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: bash scripts/runner/lint-workflows.sh
      - name: Run quick repository contract
        env:
          KUZUSHI_CRAP_RISK_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm verify:quick:summary

  # These jobs exist only in this full workflow, which cannot be triggered by
  # pull_request or push events.
  rust-core:
    name: rust-core
    needs: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      - run: bash scripts/check-public-rust-core.sh

  windows-compile:
    name: windows-compile
    needs: quality-gauntlet
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      - run: cargo check --workspace --all-targets --locked
      - run: "cargo test -p kuzushi-core worker_protocol::jsonl:: --locked"

  cargo-deny:
    name: cargo-deny
    needs: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  rust-cli:
    name: rust-cli
    needs: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 60
    # The native payload is host-specific, so the artifact carries the host
    # slug rather than a hardcoded `linux-x64`. Consumers read this output
    # instead of guessing, which keeps the download honest on either runner.
    outputs:
      native-artifact: ${{ steps.native-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      - uses: ./.github/actions/install-patch-validation-sandbox
      # The sandbox action installs nothing off Linux, so say so in the job
      # summary. `SandboxBackend::detect_backend` then resolves to `Plain`
      # (crates/kuzushi-sandbox/src/backend/mod.rs) and the sandbox tests stay
      # green -- the argv builders are pure string assembly, and the one
      # execution test branches on `which("bwrap")`. Green here therefore does
      # not mean bubblewrap or AppArmor were exercised.
      - name: Disclose sandbox coverage
        run: bash scripts/runner/report-sandbox-coverage.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm test:performance
      - run: cargo build --workspace --locked
      - run: node scripts/build-native-runtime.mjs
      - name: Resolve native artifact name
        id: native-artifact
        run: |
          slug="$(node --input-type=module -e 'import { nativePlatformSlug } from "./scripts/native-runtime-contract.mjs"; process.stdout.write(nativePlatformSlug());')"
          echo "name=native-${slug}" >>"$GITHUB_OUTPUT"
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.native-artifact.outputs.name }}
          path: native/
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    needs: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      # Building cargo-llvm-cov from source cost several runner-minutes per
      # run. install-action fetches the upstream release binary and verifies
      # its checksum. The version stays exact because
      # scripts/run-rust-coverage.sh refuses any other build.
      - name: Install coverage tool
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: ./.github/actions/install-patch-validation-sandbox
      - name: Enforce measured coverage
        env:
          KUZUSHI_QUALITY_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rust-coverage
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
          retention-days: 1

  # The mutation sweep is the single most expensive job in the repository (up
  # to 90 runner-minutes). It runs only when a caller asks for it explicitly:
  # release-candidate.yml passes `deep: true`, and an operator can pass it from
  # the Run workflow dialog. The monthly cron deliberately leaves it out.
  mutation:
    name: mutation
    if: ${{ inputs.deep == true }}
    needs: quality-gauntlet
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
        with:
          inherit-toolchain: true
          cache: true
      - uses: ./.github/actions/install-patch-validation-sandbox
      # Same reasoning as the coverage tool: a checksum-verified upstream
      # release binary instead of a from-source build. The version stays exact
      # because scripts/run-rust-mutations.sh refuses any other build.
      - name: Install mutation tool
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Require sampled changed mutants to be caught
        env:
          KUZUSHI_QUALITY_BASE_REF: ${{ inputs.quality_base_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm test:mutations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-results
          path: target/mutation/
          if-no-files-found: error
          retention-days: 1

  node22-compat:
    name: node22-compat
    needs: rust-cli
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.rust-cli.outputs.native-artifact }}
          path: native/
      - run: chmod -R +x native/
      - run: pnpm test
      - run: pnpm verify:pack

  verify-pack:
    name: verify-pack
    needs: rust-cli
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.rust-cli.outputs.native-artifact }}
          path: native/
      - run: chmod -R +x native/
      - run: pnpm verify:pack

  e2e:
    name: e2e
    needs: rust-cli
    runs-on: ${{ fromJSON(inputs.hosted && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","kuzushi-mac"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install semgrep (pip, cached)
        run: python -m pip install --upgrade pip && pip install -r .github/requirements-ci.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.rust-cli.outputs.native-artifact }}
          path: native/
      - name: Run smoke tests against native CLI
        env:
          KUZUSHI_CMD: node bin/kuzushi-rs.mjs
        run: pnpm test:e2e
