# Local belt-and-suspenders secret scan that runs in the same job as CI.
# Complements the dashboard-side GitGuardian check (which scans the full
# PR commit graph and can't be scoped from the repo). This job only
# scans the working tree at HEAD, which is what authors actually
# control. Field-test issue #52.
#
# We grep for Anthropic-shaped literals using a pattern that matches a
# real prefix + sufficient entropy in the suffix — bare `sk-ant-oat`
# references in source comments / production code don't match. Test
# fixtures should construct fakes via runtime byte joins (see
# tests/oauth-resolver.test.ts for the pattern).
name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  anthropic-literals:
    name: anthropic-literals
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # Need depth >1 so `git diff origin/main..HEAD` works — we
          # only flag literals introduced by THIS PR, not pre-existing
          # ones on main (the dashboard-side GitGuardian covers those
          # globally).
          fetch-depth: 0
      - name: Scan PR diff for Anthropic-shaped literals
        shell: bash
        run: |
          set -euo pipefail
          # Pattern: sk-ant-(api|oat)<digits>-<≥20 url-safe chars>.
          # The {20,} suffix length is the heuristic: real Anthropic keys
          # are 90+ chars, so 20 is well below false positives but high
          # enough to ignore short comment references like `sk-ant-oat...`.
          PATTERN='sk-ant-(api|oat)[0-9]+-[A-Za-z0-9_-]{20,}'

          # On PR builds, only flag NEW lines added vs main. On main
          # pushes, scan the whole tree (catches direct pushes that
          # bypass PR review).
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            git fetch origin main --depth=1 || true
            MATCHES=$(git diff origin/main..HEAD --unified=0 --no-color | \
              grep -E "^\+" | grep -E "$PATTERN" || true)
          else
            MATCHES=$(grep -rEn --color=never \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.git \
              --exclude-dir=generated \
              "$PATTERN" . || true)
          fi

          if [ -n "$MATCHES" ]; then
            echo "::error::Anthropic-shaped credential pattern found:"
            echo "$MATCHES"
            echo
            echo "Fixes:"
            echo "  - For test fixtures, build the prefix at runtime via"
            echo "    byte-level array joins (see tests/oauth-resolver.test.ts)"
            echo "  - For real secrets, rotate immediately and remove from history."
            exit 1
          fi
          echo "OK — no Anthropic-shaped literals introduced."
