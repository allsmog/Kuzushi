rules:
  - id: android-keystore-rsa-pkcs1
    message: |
      Android Keystore key created with KeyProperties.ENCRYPTION_PADDING_PKCS1
      (CWE-780). PKCS#1 v1.5 RSA padding is malleable and enables Bleichenbacher-
      style oracle attacks. Use OAEP padding (ENCRYPTION_PADDING_RSA_OAEP).
    severity: WARNING
    languages: [java]
    metadata:
      cwe: CWE-780
      category: security
    pattern: |
      $BUILDER.setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_RSA_PKCS1)

  - id: android-keystore-no-user-auth
    message: |
      Android Keystore key generated without setUserAuthenticationRequired(true)
      for an operation that touches user secrets (CWE-522). On a rooted device
      or a device that screen-locks after install, an attacker can use the key
      without the user being present. Pair with setUserAuthenticationValidityDurationSeconds
      on API < 30 or BiometricPrompt on API 30+.
    severity: INFO
    languages: [java]
    metadata:
      cwe: CWE-522
      category: security
    pattern: $BUILDER.setUserAuthenticationRequired(false)

  - id: android-keystore-plaintext-key
    message: |
      SecretKeySpec created from a hardcoded byte array (CWE-321). The
      key sits in the dex / jadx output and is recoverable by anyone
      who pulls the APK. Move to the Android Keystore.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: CWE-321
      category: security
    patterns:
      - pattern-either:
          - pattern: new SecretKeySpec("$STR".getBytes(), $ALG)
          - pattern: new SecretKeySpec(new byte[]{...}, $ALG)
