[package]
name = "kuzushi-core"
description = "Kuzushi core primitives: config, modules, scans, findings, and runtime contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
blake3.workspace = true
# csv powers RFC-4180 findings export (`workspace:export-findings`
# with `format=csv`). Local dep — only kuzushi-core currently needs it.
csv = "1.3"
dirs.workspace = true
ed25519-dalek = "2.1"
# globset powers `.kuzushi/scope.toml` host glob matching (M2 §2.1).
# Lets operators express `*.example.com` style allow/deny rules so
# recon and Burp/HAR import refuse out-of-scope hosts.
globset = "0.4"
# ipnet powers CIDR-range matching in `.kuzushi/scope.toml`.
ipnet = "2.10"
kuzushi-codeindex = { path = "../kuzushi-codeindex" }
# In-process cpg-rs engine adapter: implicit CPG builds + taint-spec
# translation for the cpg-rs taint backend (no JVM, no external binary).
kuzushi-cpg = { path = "../kuzushi-cpg" }
kuzushi-mcp-common = { path = "../kuzushi-mcp-common" }
kuzushi-sandbox = { path = "../kuzushi-sandbox" }
libc.workspace = true
# quick-xml parses Burp Suite XML exports (M2 §2.3) and nmap XML
# (M2 §2.2) into the canonical Finding/Recon shapes — no external
# binary, sub-ms on typical PoC traffic dumps.
quick-xml = "0.41"
# Regex powers the per-target source/sink discovery sweep
# (`source_sink_discovery::run`) which scans the source tree for
# language-specific entry-point markers and privesc/RCE primitives
# without spawning tree-sitter or the cpg engine. Already a transitive
# dependency via tree-sitter; declare it explicitly so the discovery
# crate isn't relying on an indirect feature.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
roxmltree = "0.21"
# goblin parses the ELF .so files shipped inside an APK's lib/<abi>/
# directories so android-apk:native-libs can enumerate dynamic imports
# (system/exec/dlopen), exports (JNI Java_* methods), and the
# per-architecture variants without shelling out to nm/objdump.
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
# Tree-sitter is used by taint-iris-next to drop candidates whose byte
# range falls inside comments or string literals — a candidate is only
# kept when it lies inside a structurally meaningful node (call, member
# access, subscript, etc.). Adding a grammar here transparently extends
# the syntactic-narrowing pass to that language; absence of a grammar
# means the language gets the previous "raw match" behavior.
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-php = "0.23"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-typescript = "0.23"
uuid.workspace = true
url = "2"
wasmtime.workspace = true
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
wat = "1.0"

[[bench]]
name = "sbom_inventory"
harness = false

[lints]
workspace = true
