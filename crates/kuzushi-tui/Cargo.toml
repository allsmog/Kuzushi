[package]
name = "kuzushi-tui"
description = "Kuzushi Ratatui shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
kuzushi-core = { path = "../kuzushi-core" }
kuzushi-openai = { path = "../kuzushi-openai" }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde_json.workspace = true
serde.workspace = true
shlex.workspace = true
uuid.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
ctor.workspace = true
libc.workspace = true
tempfile.workspace = true
strum = { version = "0.28", features = ["derive"] }

[lints]
workspace = true
