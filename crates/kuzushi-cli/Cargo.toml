[package]
name = "kuzushi-cli"
description = "Kuzushi Rust CLI entrypoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "kuzushi"

[[bin]]
name = "kuzushi"
path = "src/main.rs"

[[bin]]
name = "kz"
path = "src/bin/kz.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kuzushi-core = { path = "../kuzushi-core" }
kuzushi-mcp-common = { path = "../kuzushi-mcp-common" }
kuzushi-openai = { path = "../kuzushi-openai" }
kuzushi-tui = { path = "../kuzushi-tui" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
