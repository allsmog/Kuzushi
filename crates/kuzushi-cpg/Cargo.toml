[package]
name = "kuzushi-cpg"
description = "In-process cpg-rs engine adapter: artifact conventions, implicit CPG builds, and catalog-signal to taint-spec translation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["private-engine"]
# Historical feature name retained for compatibility. The implementation now
# comes from the public oxidized-joern repository; disabling this feature keeps
# the fail-closed adapter surface for embedding consumers.
private-engine = [
  "dep:cpg-analysis",
  "dep:cpg-cli",
  "dep:cpg-core",
  "dep:cpg-incremental",
]

[dependencies]
cpg-analysis = { workspace = true, optional = true }
cpg-cli = { workspace = true, optional = true }
cpg-core = { workspace = true, optional = true }
cpg-incremental = { workspace = true, optional = true }
regex = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
