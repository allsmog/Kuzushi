<svg xmlns='http://www.w3.org/2000/svg' width='960' height='560' viewBox='0 0 960 560'><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#334155'/></marker><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:12}.trust{fill:#fff7ed;stroke:#f97316;stroke-width:1.5;stroke-dasharray:6 4;rx:12}.core{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8;rx:12}.state{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:12}.external{fill:#fdf2f8;stroke:#db2777;stroke-width:1.5;rx:12}.label{font-family:Arial, sans-serif;font-size:13px;fill:#0f172a}.small{font-family:Arial, sans-serif;font-size:11px;fill:#475569}.title{font-family:Arial, sans-serif;font-size:20px;font-weight:bold;fill:#0f172a}.edge{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#f97316;stroke-width:1.2;stroke-dasharray:5 4;fill:none}</style></defs><text x='30' y='32' class='title'>Kuzushi pre-audit architecture</text><rect x='20' y='60' width='220' height='90' class='trust'/><text x='40' y='90' class='label'>Local user or CI</text><text x='40' y='112' class='small'>CLI args, repo path, flags</text><rect x='20' y='210' width='220' height='110' class='trust'/><text x='40' y='240' class='label'>Untrusted target repo</text><text x='40' y='262' class='small'>source files, symlinks, large inputs</text><text x='40' y='282' class='small'>prompt-injection content</text><rect x='20' y='385' width='220' height='90' class='trust'/><text x='40' y='415' class='label'>Environment and config</text><text x='40' y='437' class='small'>API keys, provider settings</text><rect x='300' y='60' width='250' height='90' class='core'/><text x='320' y='90' class='label'>Kuzushi CLI binary</text><text x='320' y='112' class='small'>crates/kuzushi-cli/src/main.rs</text><text x='320' y='132' class='small'>parse args and dispatch</text><rect x='300' y='190' width='250' height='105' class='core'/><text x='320' y='222' class='label'>Command handlers</text><text x='320' y='244' class='small'>scan, threat model, x-ray</text><text x='320' y='264' class='small'>filesystem and artifact orchestration</text><rect x='610' y='185' width='270' height='115' class='core'/><text x='630' y='217' class='label'>pi-agent-core runtime</text><text x='630' y='239' class='small'>prompt assembly and model orchestration</text><text x='630' y='259' class='small'>schema parsing and validation</text><rect x='650' y='45' width='250' height='95' class='external'/><text x='670' y='78' class='label'>External model providers</text><text x='670' y='100' class='small'>network API boundary</text><text x='670' y='120' class='small'>untrusted model responses</text><rect x='300' y='365' width='260' height='120' class='state'/><text x='320' y='397' class='label'>.kuzushi state</text><text x='320' y='419' class='small'>threat-model.json</text><text x='320' y='439' class='small'>runs and result.json</text><text x='320' y='459' class='small'>v2/artifact-kb.sqlite3</text><rect x='620' y='365' width='280' height='120' class='state'/><text x='640' y='397' class='label'>Generated reports</text><text x='640' y='419' class='small'>x-ray/x-ray.md</text><text x='640' y='439' class='small'>entry-points.md, invariants.md</text><text x='640' y='459' class='small'>architecture.svg and run artifacts</text><path d='M240 105 L300 105' class='edge'/><path d='M425 150 L425 190' class='edge'/><path d='M240 265 L300 242' class='edge'/><path d='M240 430 L610 245' class='edge'/><path d='M550 242 L610 242' class='edge'/><path d='M745 185 L745 140' class='edge'/><path d='M650 105 L550 105' class='edge'/><path d='M425 295 L425 365' class='edge'/><path d='M560 425 L620 425' class='edge'/><path d='M745 300 L745 365' class='edge'/><path d='M300 425 L240 295' class='edge'/><rect x='10' y='50' width='250' height='440' class='dash'/><text x='28' y='515' class='small'>Orange boundary: untrusted or secret-bearing inputs</text><text x='585' y='515' class='small'>Green: persistent artifacts; Blue: trusted control plane; Pink: external API</text></svg>