# cargo-deny policy for the Kuzushi Rust workspace.
# CI runs `cargo deny check advisories licenses sources` (see ci.yml).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add entries here (with a link and rationale) only when a fix is genuinely
# unavailable upstream.
ignore = [
  # `paste` is archived/unmaintained; it is a proc-macro-only dependency of
  # ratatui 0.29 with no safe upgrade published. Re-evaluate when ratatui
  # drops it. https://rustsec.org/advisories/RUSTSEC-2024-0436
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses compatible with Kuzushi's MIT distribution (NOTICE).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Blue Oak Model License — permissive; pulled in by the cucumber BDD
  # toolchain (`synthez*`), a dev/test-only dependency of kuzushi-bdd-tui.
  "BlueOak-1.0.0",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
