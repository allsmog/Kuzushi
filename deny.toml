# cargo-deny policy for the Kuzushi Rust workspace.
# CI and contributors run the same explicit policy set:
# `cargo deny check advisories licenses bans sources`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add entries here (with a link and rationale) only when a fix is genuinely
# unavailable upstream. Ratatui 0.30 removed the archived `paste` dependency,
# so the former RUSTSEC-2024-0436 exception is intentionally gone.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with Kuzushi's MIT distribution (NOTICE).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Blue Oak Model License — permissive; pulled in by the cucumber BDD
  # toolchain (`synthez*`), a dev/test-only dependency of kuzushi-bdd-tui.
  "BlueOak-1.0.0",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  # `notify` 8.x publishes under CC0; accepted as a permissive public-domain
  # style license for the passive workspace watcher.
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# New duplicate major versions must be reviewed. Existing splits are documented
# below at the older/infrastructure root that cannot yet converge.
multiple-versions = "deny"
# Workspace members intentionally use versionless relative paths. Cargo itself
# rejects those if a package is published, so the duplicate-version policy is
# the useful supply-chain gate here.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
  # `sha2`/`ring` still use the 0.2 API while `blake3` has moved to 0.3.
  { crate = "cpufeatures@0.2.17", reason = "sha2 and ring have not converged on cpufeatures 0.3" },
  # Gimli and kasuari in the Wasmtime 46/Ratatui 0.30 graph still use
  # hashbrown 0.16 while the primary Cranelift/SQLite graph uses 0.17.
  { crate = "hashbrown@0.16.1", reason = "Wasmtime 46 and Ratatui 0.30 retain hashbrown 0.16 consumers alongside the 0.17 graph" },
  # ring, serde-saphyr, and uuid/tempfile require three incompatible getrandom
  # major APIs. The associated target-support crates follow those APIs.
  { crate = "getrandom@0.2.17", reason = "ring 0.17 pins getrandom 0.2" },
  { crate = "getrandom@0.3.4", reason = "serde-saphyr pins getrandom 0.3" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3 pins r-efi 5 on UEFI targets" },
  { crate = "wit-bindgen@0.51.0", reason = "getrandom 0.4's WASI 0.3 support pins wit-bindgen 0.51" },
  # Cucumber 0.23 pulls ref-cast's syn 3 proc macro while the rest of the
  # workspace proc-macro graph remains on syn 2.
  { crate = "syn@3.0.3", reason = "cucumber 0.23 reaches syn 3 through ref-cast while product and toolchain macros remain on syn 2" },
  # wasmtime 47 hashes with the RustCrypto 0.10 generation (cranelift-codegen
  # and wasmtime-environ both depend on sha2 0.10) while kuzushi-core and
  # kuzushi-mcp-common hash with sha2 0.11. digest/block-buffer/crypto-common
  # are the transitive tail of that same split, and curve25519-dalek 4 (via
  # ed25519-dalek 2) reaches digest 0.10 as well. Moving ed25519-dalek to 3
  # drops that second root but leaves the wasmtime one, so it cannot retire
  # these skips; they lift when wasmtime/cranelift adopt sha2 0.11.
  { crate = "sha2@0.10.9", reason = "cranelift-codegen and wasmtime-environ (wasmtime 47) pin sha2 0.10 while Kuzushi hashes with sha2 0.11" },
  { crate = "digest@0.10.7", reason = "sha2 0.10 and curve25519-dalek 4 pin digest 0.10 while Kuzushi's sha2 0.11 graph uses digest 0.11" },
  { crate = "block-buffer@0.10.4", reason = "digest 0.10 pins block-buffer 0.10 beside the digest 0.11 graph" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10 pins crypto-common 0.1 beside the digest 0.11 graph" },
  # The pinned oxidized-joern CPG graph uses the 0.25 Go grammar API while
  # Kuzushi's native tree-sitter tooling remains on 0.23. The JavaScript
  # grammar has converged on one version, so cargo-deny reports its former
  # skip as unnecessary; leaving it would silently absorb a future re-split.
  { crate = "tree-sitter-go@0.25.0", reason = "pinned oxidized-joern cpg-lang-ts requires tree-sitter-go 0.25 alongside Kuzushi's 0.23 grammar" },
]
skip-tree = [
  # windows-sys releases an ABI binding family whose version follows each
  # upstream consumer. Treat that platform family as one reviewed exception;
  # every non-Windows duplicate remains denied above.
  { crate = "windows-sys", reason = "transitive Windows ABI consumers cannot share one windows-sys generation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/allsmog/oxidized-joern.git?rev=eb69c9543356f3f1eddcb7fa5ded8ac5fde4d843"]
